[project]
name = "civicops-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0", "uvicorn[standard]>=0.30.0",
  "langgraph>=0.2.0", "langchain-core>=0.3.0",
  "pydantic>=2.8.0", "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0", "langchain-groq>=0.2.0"
]
[dependency-groups]
dev = ["pytest>=8.3.0", "httpx>=0.27.0", "ruff>=0.6.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
